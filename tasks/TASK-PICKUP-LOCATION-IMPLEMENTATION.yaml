scope:
  - "管理端以 ServiceArea 行政目录为唯一归属：省/市/区只读派生，搜索受所选区域限定，不再因输入自动提交第一条结果。"
  - "新建、规范化地址变更、六位 GCJ-02 坐标变更、INACTIVE 到 ACTIVE 在写入前执行提供方无关的行政路径核验。"
  - "未配置、不可用、不可映射和路径不一致均显式 fail-closed；纯非位置 PATCH 必须忽略位置字段并精确保留持久值。"
  - "同一服务区的同规范化地址或 50 米内候选只返回可覆写提示；PATCH 排除自身，首次提示与显式覆写写审计。"
  - "地图/搜索/逆编码状态可恢复且文案无障碍；经纬度不作为普通运营人员的主要编辑控件。"
  - "实现 AC-PICKUP-LOC-01 至 AC-PICKUP-LOC-08 的确定性自动化证据，并保持现有路由/数据兼容。"
out_of_scope:
  - "真实高德 Key、公共 OSM 生产回退、农村覆盖声明、地理围栏、生产发布或真实数据写入。"
  - "数据迁移、持久已核验状态、持久 POI ID、复杂地址治理、自动合并/删除重复点。"
  - "修改其他业务规则，或把本地测试描述为生产提供方证据。"
deliverables:
  - "后端/API 契约、核验适配器与写入边界实现。"
  - "管理端自提点表单、地图选点和错误恢复实现。"
  - "覆盖 AC-PICKUP-LOC-01 至 08 的单元/API/管理端测试。"
  - "evidence/pickup-location-implementation-2026-08-31.md，包含差异、验证、兼容/回滚和已知外部阻断。"
acceptance_criteria:
  - id: "AC-PICKUP-LOC-IMPL-01"
    given: "运营选定服务区并创建/变更/启用点位"
    when: "地理结果可映射或失败"
    then: "只有行政目录路径相容时写入；NOT_CONFIGURED/UNAVAILABLE/UNMAPPABLE/路径不一致均零写入并返回契约错误"
    evidence: "evidence/pickup-location-implementation-2026-08-31.md"
  - id: "AC-PICKUP-LOC-IMPL-02"
    given: "历史点位只修改非位置字段或提交等价位置字段"
    when: "PATCH 请求到达"
    then: "不调用适配器，忽略位置字段并精确保留原地址/坐标；刚跨六位边界才触发核验"
    evidence: "evidence/pickup-location-implementation-2026-08-31.md"
  - id: "AC-PICKUP-LOC-IMPL-03"
    given: "同区域存在相同规范化地址或 50 米内候选"
    when: "用户首次保存或携带 confirmDuplicate 覆写"
    then: "首次返回可识别候选的 409 且零写入，覆写后保存，PATCH 排除自身，两步都有审计"
    evidence: "evidence/pickup-location-implementation-2026-08-31.md"
  - id: "AC-PICKUP-LOC-IMPL-04"
    given: "地图、搜索或逆编码失败"
    when: "运营人员仍在当前表单会话"
    then: "输入/图钉不被清空，可重试/取消，但新建、位置变更、启用不得绕过核验保存"
    evidence: "evidence/pickup-location-implementation-2026-08-31.md"
  - id: "AC-PICKUP-LOC-IMPL-05"
    given: "实现完成"
    when: "执行定向测试、pnpm check 和 pnpm test:e2e"
    then: "AC-PICKUP-LOC-01 至 08 的确定性证据与相关回归通过，不声称真实提供方已验证"
    evidence: "evidence/pickup-location-implementation-2026-08-31.md"
