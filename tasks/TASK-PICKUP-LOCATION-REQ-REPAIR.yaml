scope:
  - "修订服务区语义：本轮只校验行政目录路径相容，不宣称业务几何边界或门牌正确。"
  - "冻结无持久核验状态的 PATCH 触发矩阵：新建、位置变更、inactive 到 active 必须当场核验；纯非位置编辑原样保留。"
  - "冻结提供方无关适配器、不可映射状态、未配置或失败时 fail-closed，禁止把公共 OSM 端点当作生产默认兜底。"
  - "补齐地图瓦片/交互不可用状态、当前表单会话恢复和安全回滚边界。"
  - "保留 50 米重复提示为可覆写 DEFAULT_ASSUMPTION，明确 PATCH 排除自身、地址规范化、距离计算与审计证据。"
out_of_scope:
  - "实现代码、数据迁移、真实 Key/账户验证、生产提供方批准或地理围栏。"
  - "把事故频率、50 米准确率或农村覆盖提升为已确认事实。"
