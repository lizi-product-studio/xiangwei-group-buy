  - "更新 docs/04-prd.md，增加 P1 定位配置需求及验收引用。"
  - "更新 docs/06-ux-spec.md，冻结新建/编辑自提点的定位流程、状态和文案。"
  - "更新 docs/08-system-design.md 与 docs/09-api-data-contract.md，记录最小契约 Delta、坐标系和兼容边界。"
  - "更新 docs/10-test-plan.md，加入定位配置的单元、API、浏览器及手工验收项。"
  - "新增 docs/decisions/2026-08-31-pickup-location-source-of-truth.md，记录选择、备选方案、非目标和回滚触发。"
acceptance_criteria:
  - id: "AC-PICKUP-LOC-REQ-01"
    given: "已有服务区域、行政区目录、地址搜索与地图选点实现"
    when: "Requirements 对现状和用户批准方向进行对比"
    then: "文档明确服务区域是行政归属事实源，地址搜索是首选输入，地图是确认/微调与无结果兜底；不存在两个可独立冲突的行政区事实源"
    evidence: "docs/decisions/2026-08-31-pickup-location-source-of-truth.md"
  - id: "AC-PICKUP-LOC-REQ-02"
    given: "POI 可命中、POI 无结果、上游失败和农村地址不完整四类情况"
    when: "运营创建或编辑自提点"
    then: "每类情况都有可执行的下一步、清晰反馈和保存条件，且不要求运营直接理解或编辑经纬度"
    evidence: "docs/06-ux-spec.md"
  - id: "AC-PICKUP-LOC-REQ-03"
    given: "地图坐标、逆地理地址和已选服务区域可能不一致"
    when: "运营尝试保存"
    then: "契约明确阻止跨服务区域保存并提供纠正路径；编辑旧点位不会因无法解析历史地址而静默改区或丢失坐标"
    evidence: "docs/01-domain-rules.md + docs/09-api-data-contract.md"
  - id: "AC-PICKUP-LOC-REQ-04"
    given: "研发将按冻结基线实施"
    when: "创建后续 Engineering Lead Task Package"
    then: "测试计划包含服务区域自动带出、POI 选择、拖动逆编码、越界拒绝、上游失败兜底、编辑兼容和重复点位提示的可验证项"
    evidence: "docs/10-test-plan.md"
