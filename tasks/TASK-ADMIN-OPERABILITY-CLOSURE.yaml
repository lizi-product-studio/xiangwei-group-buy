  value: "后台运营人员需要在服务不可用或校验失败时看到可理解、可恢复的结果；目录与分类必须由有效主数据驱动，不能依赖内部编号或英文异常。"
  affected_roles: [SUPER_ADMIN, OPERATOR, CUSTOMER_SERVICE, FINANCE, PICKUP_MANAGER]
  affected_objects: [Product, Category, ServiceArea, PickupPoint, Campaign, Order, Delivery, Notification, AuditEvent]
