dependencies:
  - "保持现有单一社区团购状态机、权限、支付退款规则与消费者小程序非本次页面不变"
scope:
  - "统一管理端 API/网络/Zod/401/403/409/5xx 错误为中文可恢复文案，保留结构化详情供字段映射"
  - "dashboard/products/campaigns/orders/areas/pickup-points/delivery/after-sale/governance/finance/settings 统一 loading/error/empty/ready 四态及重试"
  - "写操作 submitting 防重复；写成功后刷新失败与写失败分离，表单草稿可恢复"
  - "分类主数据 API、Memory/MySQL 存储与管理入口：新增、改名/排序、停用、引用保护；商品只能选有效分类"
  - "商品字段补充销售规格（包装单位）、默认团期可售量、产地示例与契约校验"
  - "区域行政目录选择、团期创建前置引导/切区清点位/商品带入默认价量、到货数量守恒与差异草案复核"
  - "员工/权限写操作失败恢复；普通页面内部枚举和 ISO 时间转中文业务显示，技术编号折叠"
  - "消费者结算无字段 JSON POST 契约与订单创建后支付失败恢复，不改变支付状态机"
out_of_scope:
  - "消费者小程序其他页面、真实微信登录/支付/订阅、退款和配送领域状态机改造"
  - "多商户、供应商、仓储、旧模式、生产部署和真实环境写入"
  - "消费者账号注销、隐私联系渠道或新增外部凭据"
deliverables:
  - "后台错误适配与页面状态/写入恢复实现"
  - "分类主数据契约、存储、API、管理 UI 与引用保护测试"
  - "区域/团期/到货/权限表单前置校验与可恢复交互"
  - "结算创建失败与已创建订单支付失败的分阶段提示、原订单继续支付和防重复测试"
  - "定向单元/API/浏览器证据与本文件更新"
acceptance_criteria:
  - id: AC-ADMIN-ERR-01
    given: "API 网络失败、5xx、401/403/409 或 Zod details"
    when: "后台页面请求或写入失败"
    then: "只显示中文业务文案、恢复动作和字段提示，不显示英文原文/HTTP 码/内部字段；网络错误保留草稿"
    evidence: "evidence/admin-operability-closure-2026-09-02.md"
  - id: AC-ADMIN-STATE-02
    given: "主页面 GET 失败、无数据或有数据"
    when: "页面加载/重试"
    then: "分别显示 loading/error+重试/empty 引导/ready，错误不得伪装为空表或零值"
    evidence: "evidence/admin-operability-closure-2026-09-02.md"
  - id: AC-ADMIN-MUT-03
    given: "写请求进行中、失败或成功后刷新失败"
    when: "用户提交或重复点击"
    then: "按钮禁用且只发一次；失败保留表单；成功刷新失败显示已保存并可重试，不重复 POST"
    evidence: "evidence/admin-operability-closure-2026-09-02.md"
  - id: AC-ADMIN-CAT-04
    given: "运营管理分类并编辑商品"
    when: "新增/改名/排序/停用/删除或选择分类"
    then: "引用分类不可硬删除，商品仅可选启用分类；无分类时给出创建引导"
    evidence: "evidence/admin-operability-closure-2026-09-02.md"
  - id: AC-ADMIN-FORM-05
    given: "区域、团期、到货和员工表单"
    when: "缺少前置对象、切换依赖或数量/权限不合法"
    then: "前端明确拦截并与服务端契约一致，保留输入、说明下一步和恢复路径"
    evidence: "evidence/admin-operability-closure-2026-09-02.md"
  - id: AC-MINI-PAY-06
    given: "用户提交订单后，订单创建或后续支付任一阶段失败"
    when: "小程序展示结果并允许恢复"
    then: "创建失败不跳转；已创建订单保留购物车与结算草稿并可查看原订单继续支付，不重复创建、不直出技术错误"
    evidence: "evidence/admin-operability-closure-2026-09-02.md"
