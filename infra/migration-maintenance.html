<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>禾邻甄选 · 系统配置中</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f5f7f3; color: #213b2d; font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      main { width: min(100%, 560px); padding: 48px 36px; background: white; border: 1px solid #dce5dc; border-radius: 20px; }
      .brand { margin: 0 0 36px; font-size: 18px; font-weight: 700; letter-spacing: 2px; }
      .status { display: inline-block; padding: 6px 12px; border-radius: 20px; background: #eaf2e9; font-size: 14px; }
      h1 { margin: 20px 0 16px; font-size: clamp(26px, 5vw, 34px); line-height: 1.4; }
      p { margin: 12px 0 0; line-height: 1.8; color: #4c6054; }
      footer { margin-top: 36px; padding-top: 20px; border-top: 1px solid #e4ebe3; font-size: 14px; color: #586b5f; }
      @media (max-width: 420px) { main { padding: 32px 24px; } }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">禾邻甄选</p>
      <span class="status">系统配置中</span>
      <h1>暂未开放登录与下单</h1>
      <p>拼团系统正在完成上线配置与验证。当前无法登录、下单或支付，请稍后再来。</p>
      <footer>原家政服务已下线。</footer>
    </main>
  </body>
</html>
