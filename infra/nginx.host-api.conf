# TASK-20260907-HOUSEKEEPING-REPLACE
# Live API configuration. Install only after API health and release QA pass.
# Roll back to nginx.migration-maintenance.conf before stopping an unhealthy API.
# Replace BOTH housekeeping.conf and admin.liziqi.icu.conf; never append this
# beside either old server block. Preserve their exact backups for rollback.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 410;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    listen 8443 ssl default_server;
    listen [::]:8443 ssl default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/housekeeping-platform/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/housekeeping-platform/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 410;
}
server {
    listen 80;
    listen [::]:80;
    server_name liziqi.icu admin.liziqi.icu saas.liziqi.icu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name liziqi.icu admin.liziqi.icu saas.liziqi.icu;
    ssl_certificate /etc/letsencrypt/live/housekeeping-platform/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/housekeeping-platform/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/hometown-admin-current;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;

    location = /api/v1/admin/product-images {
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
    location = /api/v1/me/profile-image {
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
    location ^~ /api/v1/product-images/ {
        # Override server header inheritance so the API immutable cache policy survives.
        add_header X-Content-Type-Options nosniff always;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location ~ ^/(api|health)(/|$) {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    location ~ ^/(admin|platform|uploads|public-media)(/|$) {
        return 410;
    }
    location = / {
        try_files /index.html =503;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location / {
        return 410;
    }
}
