# Independent empty data services for TASK-20260907-HOUSEKEEPING-REPLACE.
# No host ports, no application, no gateway, no legacy volumes.
# Start only after resource review; do not run alongside legacy MySQL on 2GB.
name: hometown-food
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: 640m
    environment:
      MYSQL_DATABASE: hometown_food
      MYSQL_USER: hometown
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --innodb-buffer-pool-size=134217728
      - --max-connections=40
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -uroot --silent']
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [backend]
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    mem_limit: 192m
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?required}", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [backend]
volumes: { mysql_data: {}, redis_data: {} }
networks: { backend: {} }
