# TASK-20260907-HOUSEKEEPING-REPLACE
# Staged retirement configuration. Install only after backup/financial review.
# The API remains unavailable until its production configuration is approved.
# Replace BOTH housekeeping.conf and admin.liziqi.icu.conf; never append this
# beside either old server block. Preserve their exact backups for rollback.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 410;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    listen 8443 ssl default_server;
    listen [::]:8443 ssl default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/housekeeping-platform/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/housekeeping-platform/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 410;
}
server {
    listen 80;
    listen [::]:80;
    server_name liziqi.icu admin.liziqi.icu saas.liziqi.icu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name liziqi.icu admin.liziqi.icu;
    ssl_certificate /etc/letsencrypt/live/housekeeping-platform/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/housekeeping-platform/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/hometown-admin-current;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;

    location ~ ^/(api|health)(/|$) {
        default_type application/json;
        add_header Retry-After 3600 always;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"服务迁移中，暂未开放"}}';
    }
    location ~ ^/(admin|platform|uploads|public-media)(/|$) {
        return 410;
    }
    location = / {
        try_files /index.html =503;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location / {
        return 410;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name saas.liziqi.icu;
    ssl_certificate /etc/letsencrypt/live/housekeeping-platform/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/housekeeping-platform/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    default_type text/plain;
    return 410 "家政服务已下线。";
}
