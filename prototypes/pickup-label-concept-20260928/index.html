<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自提点信息精简 · 对照原型</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f4f0;color:#273830;font:15px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}button{font:inherit;cursor:pointer}header{background:white;padding:18px 6%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e6e8e1}header strong{font-size:17px}header small{color:#8b8f86}main{max-width:1060px;margin:36px auto;padding:0 24px}h1{font-size:28px;margin:0 0 10px}p{line-height:1.7;color:#778075;margin:6px 0}nav{display:flex;gap:8px;margin:22px 0}nav button{border:1px solid #dce2d7;background:white;padding:9px 24px;border-radius:8px;color:#53614f}nav button.active{background:#334f3d;color:white;border-color:#334f3d}.compare{display:grid;grid-template-columns:1fr 1fr;gap:24px}.label{font-size:12px;letter-spacing:1px;color:#849080;margin-bottom:10px}.label.new{color:#9d422e}.phone{max-width:420px;margin:auto;border:1px solid #e0e3db;border-radius:28px;background:#fff9f3;overflow:hidden;box-shadow:0 14px 40px #2c42200a;min-height:390px}.top{height:39px;padding:12px 22px;font-size:12px;background:white;font-weight:600}.page{background:white;text-align:center;padding:10px;font-size:17px}.red{background:linear-gradient(110deg,#f45440,#df3c31);color:white;padding:22px}.red h2{margin:0;font-size:23px}.red p{color:white;font-size:12px}.point{display:flex;align-items:center;gap:14px}.point .icon{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#f3f0df;font-size:27px;flex-shrink:0}.point .body{flex:1;min-width:0}.point small{display:block;font-size:12px;margin-bottom:5px;opacity:.75}.point b{font-size:19px}.address{font-size:13px;line-height:1.6;margin-top:7px;color:#7d8277}.red .address{color:white}.arrow{font-size:24px;opacity:.65}.card{background:white;border:1px solid #e5e5d9;border-radius:16px;margin:15px 16px;padding:20px}.card h3{font-size:18px;margin:0}.cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.link{border:0;background:transparent;color:#55703d;font-size:12px;padding:0}.hint{font-size:12px;color:#a47d68;margin-top:7px}.actions{display:flex;gap:8px;margin-top:18px;border-top:1px solid #ecebe1;padding-top:12px}.actions button{flex:1;border:0;border-radius:9px;padding:10px;background:#fff3ed;color:#d94834;font-size:13px}.empty{text-align:center;padding:36px 15px}.empty b{display:block;font-size:19px;margin:8px}.empty .cart{font-size:40px;color:#a8afa6}.empty p{font-size:12px}.sub{padding:25px;text-align:center;color:#9e9f93;font-size:13px}.note{background:#eef3eb;border:1px solid #dce6d6;border-radius:12px;padding:16px 20px;margin-top:26px;color:#5c7054;font-size:13px;line-height:1.8}.sample{margin-top:25px;border-top:1px solid #e0e3da;padding-top:20px}.sample b{font-size:14px}.example{background:white;padding:14px 18px;border-radius:10px;margin-top:10px}.example small{display:block;color:#8a9384;margin-top:7px}dialog{border:0;border-radius:20px;padding:28px;max-width:390px;width:90%;color:#293c31;box-shadow:0 20px 90px #20301830}dialog::backdrop{background:#17251e65}dialog h2{font-size:21px;margin:0 0 15px}dialog button{border:0;background:#bb4935;color:white;padding:11px;width:100%;border-radius:8px;margin-top:20px}dialog p{font-size:14px}.badge{font-size:10px;color:#aa7a58;margin-bottom:10px}@media(max-width:700px){main{margin:24px auto;padding:0 15px}.compare{grid-template-columns:1fr}.phone{max-width:none}h1{font-size:23px}header small{display:none}nav button{flex:1;padding:9px 12px}}
</style><header><strong>乡味集 / 自提点信息精简</strong><small>设计提案 · 仅比较信息展示</small></header><main><h1>名称说清地点，地址补充细节。</h1><p>保留三个页面入口。仅当地址没有补充定位信息时，收起重复的第二行。</p><nav aria-label="页面切换"><button data-page="home" class="active">首页</button><button data-page="cart">购物车</button><button data-page="mine">我的</button></nav><div class="compare"><section><div class="label">调整前 · 名称和地址重复表达地点</div><div class="phone" id="before"></div></section><section><div class="label new">调整后 · 保留名称，完整地址点开查看</div><div class="phone" id="after"></div></section></div><div class="note" id="note"></div><div class="sample"><b>如果地址包含具体入口，就继续显示</b><div class="example">定兴三中自提点<small>东门右侧服务站（仅为展示规则举例，并非该点真实地址）</small></div></div></main><dialog id="detail"><div class="badge">原型展示 · 不发起导航或电话</div><h2>定兴三中自提点</h2><p>完整地址</p><p style="color:#293c31">河北省保定市定兴县定兴镇河北定兴第三中学</p><p style="margin-top:14px">原始地址在这里保留；导航仍使用已有点位坐标。</p><button id="close">关闭</button></dialog><script>
let page='home';const full='河北省保定市定兴县定兴镇河北定兴第三中学';const point=(old,home=false)=>`<div class="point"><div class="body"><small>${home?'当前固定自提点':'当前自提点'}</small><b>定兴三中自提点</b>${old?`<div class="address">${full}</div>`:''}</div>${home?'<div class="icon" aria-hidden="true">🏫</div>':'<span class="arrow">›</span>'}</div>`;
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));for(const [id,old]of[['before',true],['after',false]]){let content='<div class="top">9:41 <span style="float:right">▂▄▆ ▰</span></div>';if(page==='home')content+=`<div class="red"><h2 style="margin-bottom:22px">乡味集</h2><div ${old?'':'role="button" tabindex="0" data-detail="true" aria-label="查看自提点完整地址"'}>${point(old,true)}</div></div><div class="card"><h3>本点正在开团</h3><p style="font-size:13px;margin-top:12px">团期、商品与领取安排保持原有展示。</p></div>`;else if(page==='cart')content+=`<div class="page">购物车</div><div class="red"><h2>购物车</h2><p>切换点位或团期，已选商品都会保留</p></div><div class="card" ${old?'':'role="button" tabindex="0" data-detail="true" aria-label="查看自提点完整地址"'}>${point(old)}</div><div class="empty"><span class="cart">🛒</span><b>购物车还是空的</b><p>不同团期、不同自提点的商品可以一起结算。</p></div>`;else content+=`<div class="page">我的</div><div class="red"><h2>个人中心</h2><p>编辑资料 ›</p></div><div class="card"><div class="cardhead"><h3>我的当前自提点</h3><button class="link" data-detail="true">查看 / 切换 ›</button></div>${point(old)}<div class="hint">到店出示领取码</div><div class="actions"><button data-detail="true">一键导航</button><button data-detail="true">拨打电话</button></div></div><div class="sub">常用服务入口保持原有位置</div>`;document.getElementById(id).innerHTML=content}document.getElementById('note').textContent=page==='home'?'首页：保留点位名称与选择入口，省去重复学校名称的一整行地址。点击右侧点位可查看完整地址。':page==='cart'?'购物车：保留当前自提点卡片，省去重复地址行。购物车功能和多点位结算方式保持不变。':'我的：保留点位卡片、查看/切换、导航和电话。完整地址在详情查看，不删原始数据。'}
document.addEventListener('click',e=>{const p=e.target.closest('[data-page]');if(p){page=p.dataset.page;render()}if(e.target.closest('[data-detail]'))document.getElementById('detail').showModal()});document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-detail][role="button"]')){e.preventDefault();document.getElementById('detail').showModal()}});document.getElementById('close').onclick=()=>document.getElementById('detail').close();render();
</script></html>
