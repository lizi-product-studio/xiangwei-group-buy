<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>乡味集 · 支付结果页交互原型</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="preview">
    <aside class="brief">
      <div class="eyebrow"><span class="mark">乡</span> XIANG WEI JI / CART</div>
      <h1>一辆购物车，<br><em>各自去提货。</em></h1>
      <p class="lede">切换自提点后保留已加购商品。结算时按自提点与团期分组，确认两处领取后一次付款，生成独立订单和提货码。</p>
      <div class="steps">
        <div><b>01</b><span>切换点位并加购</span></div>
        <div><b>02</b><span>购物车分组核对</span></div>
        <div><b>03</b><span>查看支付结果与订单</span></div>
      </div>
      <p class="footnote">交互原型 · 示例商品与订单 · 不发起真实支付</p>
    </aside>
    <section class="device-wrap" aria-label="多点位购物车交互原型">
      <div class="phone"><div class="phone-screen"><div id="app"></div></div></div>
      <span class="device-caption">进入结算后，可体验成功、失败、取消与确认中</span>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
