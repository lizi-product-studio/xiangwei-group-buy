<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1640" viewBox="0 0 750 1640"><rect width="750" height="1640" fill="#f7f5e9"/><rect x="36" y="36" width="678" height="1568" rx="30" fill="#fffdf6"/><text x="375" y="105" text-anchor="middle" fill="#71875b" font-size="20" font-family="sans-serif">乡味集 · 商品详情示例</text><text x="375" y="180" text-anchor="middle" fill="#2d4836" font-size="46" font-weight="bold" font-family="sans-serif">一口清甜，日常好滋味</text><text x="375" y="230" text-anchor="middle" fill="#838774" font-size="24" font-family="sans-serif">鲜甜黄玉米 / 图片与文案仅供原型演示</text><ellipse cx="375" cy="420" rx="184" ry="132" fill="#f3edce"/><path d="M355 533 Q221 431 252 299 Q385 309 389 535" fill="#7b9759"/><path d="M388 539 Q495 405 486 318 Q385 342 375 529" fill="#557746"/><rect x="335" y="295" width="90" height="228" rx="45" fill="#e6b840"/><g fill="#f6d564"><circle cx="359" cy="329" r="13"/><circle cx="389" cy="329" r="13"/><circle cx="359" cy="363" r="13"/><circle cx="389" cy="363" r="13"/><circle cx="359" cy="397" r="13"/><circle cx="389" cy="397" r="13"/><circle cx="359" cy="431" r="13"/><circle cx="389" cy="431" r="13"/><circle cx="359" cy="465" r="13"/><circle cx="389" cy="465" r="13"/></g><text x="375" y="610" text-anchor="middle" fill="#2d4836" font-size="32" font-weight="bold" font-family="sans-serif">颗粒饱满 · 清甜多汁</text><text x="375" y="660" text-anchor="middle" fill="#7e8274" font-size="24" font-family="sans-serif">蒸一蒸、煮一煮，轻松端上餐桌</text><line x1="100" x2="650" y1="725" y2="725" stroke="#e1e5d6"/><text x="100" y="805" fill="#2d4836" font-size="34" font-weight="bold" font-family="sans-serif">01　食用与保存</text><text x="100" y="865" fill="#727e6b" font-size="25" font-family="sans-serif">收到后请及时检查，冷藏保存。</text><text x="100" y="915" fill="#727e6b" font-size="25" font-family="sans-serif">按实际商品说明蒸煮，尽早食用。</text><rect x="90" y="980" width="570" height="430" rx="20" fill="#edf1e5"/><text x="125" y="1045" fill="#2d4836" font-size="34" font-weight="bold" font-family="sans-serif">02　售后说明</text><text x="125" y="1110" fill="#66745e" font-size="25" font-family="sans-serif">领取时请当面核对商品与数量。</text><text x="125" y="1160" fill="#66745e" font-size="25" font-family="sans-serif">如有破损或质量问题，保留凭证，</text><text x="125" y="1210" fill="#66745e" font-size="25" font-family="sans-serif">通过订单售后入口联系处理。</text><text x="125" y="1290" fill="#9b7058" font-size="22" font-family="sans-serif">示例说明，正式规则由运营填写。</text><text x="125" y="1330" fill="#9b7058" font-size="22" font-family="sans-serif">不在原型中承诺具体退款时限。</text><text x="375" y="1510" text-anchor="middle" fill="#8b9482" font-size="23" font-family="sans-serif">长图完整展示 · 不裁切内容</text></svg>
