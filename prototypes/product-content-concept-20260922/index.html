<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>乡味集 · 商品与消息体验原型</title><link rel="stylesheet" href="style.css"></head><body>
<header class="reviewbar"><div><b>乡味集</b><span class="reviewtag">交互原型 · 待确认</span><span class="muted">仅演示，本页不会修改线上数据</span></div><div><button data-act="notes">方案说明</button><button data-act="reset">重置演示</button></div></header>
<div class="workspace"><aside class="sidebar"><div class="brand"><i>乡</i><div><b>乡味集</b><small>运营管理后台</small></div></div><p>商品与团期</p><button data-admin="product" class="active">商品管理</button><p>自提点与区域</p><button data-admin="point">自提点管理</button><div class="side-note">本轮评审<br><strong>让商品讲清楚<br>让提醒更及时</strong><small>商品内容 / 销量 / 消息订阅 / 点位照片</small></div></aside>
<main id="admin"></main><aside class="preview"><div class="preview-title"><div><b>小程序预览</b><small>可点击、滑动、上传后查看</small></div><span class="live-dot">草稿演示</span></div><nav class="preview-tabs"><button data-page="home">首页</button><button data-page="detail" class="active">商品</button><button data-page="profile">我的</button><button data-page="messages">消息提醒</button><button data-page="pickup">自提点</button></nav><div class="phone"><div class="status"><b>09:41</b><span>▮▮▮　Wi-Fi　▰</span></div><div class="mini-title"><button data-act="back">‹</button><b id="mini-title"></b><span>•••　◉</span></div><div id="mini" class="mini-scroll"></div><div id="mini-footer"></div><div class="home-indicator"></div></div><div class="scenario"><span>订阅状态演示</span><select id="scenario"><option value="none">未订阅</option><option value="partial">部分订阅</option><option value="all">本次已订阅</option><option value="used">需再次订阅</option><option value="off">已关闭提醒</option><option value="guest">未登录</option></select></div><p class="preview-hint">图片与销量为示例。上传、保存、授权均只在当前原型中演示。</p></aside></div>
<div id="overlay" hidden></div><div id="toast" role="status"></div><input id="file-input" type="file" accept="image/jpeg,image/png,image/webp" hidden><script src="app.js"></script></body></html>
